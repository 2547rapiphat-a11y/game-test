<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งูกินหัวใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
:root { color-scheme: light; }
body { margin: 0; }
/* Layout: one centered column. Header with title and three stats, a square board with a veil overlay for ready/paused/over, then controls and a touch d-pad. */
:root {
  --bg: #F4EEF2;
  --ink: #2A1722;
  --muted: #7A6571;
  --board: #FBF7F9;
  --grid: #EFE3EA;
  --veil: rgba(251, 247, 249, 0.86);
  --panel: #FFFFFF;
  --line: #DCCBD4;
  --snake: #2FA284;
  --snake-head: #126B55;
  --heart: #D81F55;
  --on-heart: #FFFFFF;
  --font-display: "Mitr", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B0F17;
    --ink: #F6E7EE;
    --muted: #B79AA9;
    --board: #27131F;
    --grid: #311A29;
    --veil: rgba(39, 19, 31, 0.86);
    --panel: #2A1521;
    --line: #442638;
    --snake: #4FC4A3;
    --snake-head: #8DEAD0;
    --heart: #FF4D7E;
    --on-heart: #2A0A16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B0F17;
  --ink: #F6E7EE;
  --muted: #B79AA9;
  --board: #27131F;
  --grid: #311A29;
  --veil: rgba(39, 19, 31, 0.86);
  --panel: #2A1521;
  --line: #442638;
  --snake: #4FC4A3;
  --snake-head: #8DEAD0;
  --heart: #FF4D7E;
  --on-heart: #2A0A16;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app {
  width: 100%;
  max-width: 540px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px 16px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 2rem;
  line-height: 1.2;
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}
h1 svg { width: 1.1em; height: 1.1em; flex: none; fill: var(--heart); }
.stats { display: flex; gap: 8px; }
.stat {
  min-width: 74px;
  padding: 6px 12px 7px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.stat span {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.stat b {
  display: block;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.35rem;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}
.stat.hot b { color: var(--heart); }

.board-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 100%;
  border: 2px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  background: var(--board);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.veil {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 20px;
  text-align: center;
  background: var(--veil);
}
.veil[hidden] { display: none; }
.veil h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.6rem;
  line-height: 1.3;
  text-wrap: balance;
}
.veil p { margin: 0 0 10px; color: var(--muted); text-wrap: balance; }

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}
button:focus-visible {
  outline: 3px solid var(--heart);
  outline-offset: 2px;
}
.primary {
  background: var(--heart);
  color: var(--on-heart);
  border: 0;
  border-radius: 999px;
  padding: 10px 26px;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.05rem;
  min-height: 44px;
}
.primary:active { transform: translateY(1px); }

.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
}
.seg {
  display: inline-flex;
  padding: 3px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.seg button {
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 6px 14px;
  min-height: 36px;
  font-size: 0.9rem;
  color: var(--muted);
}
.seg button[aria-pressed="true"] {
  background: var(--heart);
  color: var(--on-heart);
  font-weight: 600;
}
.hint { margin: 0; font-size: 0.85rem; color: var(--muted); }

.dpad {
  display: none;
  grid-template-columns: repeat(3, 64px);
  grid-template-rows: repeat(2, 64px);
  gap: 8px;
  justify-content: center;
  margin-top: 4px;
}
.dpad button {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  display: grid;
  place-items: center;
  touch-action: manipulation;
}
.dpad button:active { background: var(--heart); }
.dpad svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.dpad .up { grid-column: 2; grid-row: 1; }
.dpad .left { grid-column: 1; grid-row: 2; }
.dpad .down { grid-column: 2; grid-row: 2; }
.dpad .right { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) {
  .dpad { display: grid; }
  .hint { display: none; }
}
@media (max-width: 420px) {
  h1 { font-size: 1.7rem; }
  .stat { min-width: 64px; padding-inline: 10px; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5C5 16.2 2 12.6 2 8.6 2 5.6 4.3 3.5 7 3.5c1.9 0 3.7 1 5 2.8 1.3-1.8 3.1-2.8 5-2.8 2.7 0 5 2.1 5 5.1 0 4-3 7.6-10 12.9z"/></svg>
      งูกินหัวใจ
    </h1>
    <div class="stats" aria-live="polite">
      <div class="stat hot"><span>หัวใจ</span><b id="score">0</b></div>
      <div class="stat"><span>สถิติ</span><b id="best">0</b></div>
      <div class="stat"><span>ระดับ</span><b id="level">1</b></div>
    </div>
  </header>

  <div class="board-wrap">
    <canvas id="board" aria-label="กระดานเกมงูกินหัวใจ"></canvas>
    <div class="veil" id="veil">
      <h2 id="veilTitle">พร้อมกินหัวใจหรือยัง</h2>
      <p id="veilText">กดลูกศรหรือปัดบนกระดานเพื่อเริ่มเล่น</p>
      <button class="primary" id="veilBtn" type="button">เริ่มเล่น</button>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="โหมดกำแพง">
      <button type="button" id="modeWall" aria-pressed="true">ชนกำแพง</button>
      <button type="button" id="modeWrap" aria-pressed="false">ทะลุกำแพง</button>
    </div>
    <button class="seg-pause" id="pauseBtn" type="button" style="background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;min-height:42px;">หยุดชั่วคราว</button>
  </div>
  <p class="hint">ใช้ลูกศรหรือ W A S D เพื่อบังคับ กดเว้นวรรคเพื่อหยุด</p>

  <div class="dpad" aria-label="ปุ่มบังคับทิศทาง">
    <button class="up" type="button" data-dir="up" aria-label="ขึ้น"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
    <button class="left" type="button" data-dir="left" aria-label="ซ้าย"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="down" type="button" data-dir="down" aria-label="ลง"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
    <button class="right" type="button" data-dir="right" aria-label="ขวา"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script>
(function () {
  var N = 20;
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var veil = document.getElementById('veil');
  var veilTitle = document.getElementById('veilTitle');
  var veilText = document.getElementById('veilText');
  var veilBtn = document.getElementById('veilBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level');
  var modeWall = document.getElementById('modeWall');
  var modeWrap = document.getElementById('modeWrap');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var snake, dir, queue, heart, score, state, tickMs, acc, lastTs, wrap, best, particles;
  var size = 0, cell = 0, dpr = 1;
  var colors = null;

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    function v(n) { return cs.getPropertyValue(n).trim(); }
    colors = {
      board: v('--board'), grid: v('--grid'), snake: v('--snake'),
      head: v('--snake-head'), heart: v('--heart'), ink: v('--ink')
    };
  }
  function dirtyColors() { colors = null; }
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', dirtyColors);
  new MutationObserver(dirtyColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function bestKey() { return wrap ? 'heart-snake-best-wrap' : 'heart-snake-best-wall'; }
  function loadBest() {
    try { best = parseInt(localStorage.getItem(bestKey()), 10) || 0; } catch (e) { best = 0; }
  }
  function saveBest() {
    try { localStorage.setItem(bestKey(), String(best)); } catch (e) {}
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    size = rect.width;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    cell = size / N;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tickMs = 140;
    acc = 0;
    particles = [];
    placeHeart();
    updateHud();
  }

  function placeHeart() {
    var free = [];
    for (var x = 0; x < N; x++) {
      for (var y = 0; y < N; y++) {
        var taken = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { taken = true; break; }
        }
        if (!taken) free.push({ x: x, y: y });
      }
    }
    if (!free.length) { heart = null; return false; }
    heart = free[Math.floor(Math.random() * free.length)];
    return true;
  }

  function level() { return Math.floor(score / 5) + 1; }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level();
  }

  function showVeil(title, text, btn) {
    veilTitle.textContent = title;
    veilText.textContent = text;
    veilBtn.textContent = btn;
    veil.hidden = false;
  }

  function setState(s, info) {
    state = s;
    if (s === 'playing') {
      veil.hidden = true;
      pauseBtn.textContent = 'หยุดชั่วคราว';
      pauseBtn.disabled = false;
    } else if (s === 'ready') {
      showVeil('พร้อมกินหัวใจหรือยัง', 'กดลูกศรหรือปัดบนกระดานเพื่อเริ่มเล่น', 'เริ่มเล่น');
      pauseBtn.textContent = 'หยุดชั่วคราว';
      pauseBtn.disabled = true;
    } else if (s === 'paused') {
      showVeil('หยุดอยู่', 'กดปุ่มหรือเว้นวรรคเพื่อเล่นต่อ', 'เล่นต่อ');
      pauseBtn.textContent = 'เล่นต่อ';
      pauseBtn.disabled = false;
    } else if (s === 'over') {
      var title = info === 'wall' ? 'งูชนกำแพง' : info === 'full' ? 'กินครบทั้งกระดาน' : 'งูกัดตัวเอง';
      var text = 'กินหัวใจได้ ' + score + ' ดวง' + (score > 0 && score >= best ? ' เป็นสถิติใหม่' : '');
      showVeil(title, text, 'เล่นอีกครั้ง');
      pauseBtn.textContent = 'หยุดชั่วคราว';
      pauseBtn.disabled = true;
    }
  }

  function start() { setState('playing'); lastTs = performance.now(); }

  function mainAction() {
    if (state === 'ready') start();
    else if (state === 'paused') start();
    else if (state === 'over') { reset(); start(); }
    else if (state === 'playing') setState('paused');
  }

  function setDir(dx, dy) {
    if (state === 'over') return;
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if ((dx === ref.x && dy === ref.y) || (dx === -ref.x && dy === -ref.y)) {
      if (state !== 'playing') start();
      return;
    }
    if (queue.length < 2) queue.push({ x: dx, y: dy });
    if (state === 'ready' || state === 'paused') start();
  }

  function burst(cx, cy) {
    if (reduceMotion) return;
    for (var i = 0; i < 6; i++) {
      var a = Math.random() * Math.PI * 2;
      particles.push({
        x: (cx + 0.5) * cell, y: (cy + 0.5) * cell,
        vx: Math.cos(a) * 40 + (Math.random() - 0.5) * 20,
        vy: Math.sin(a) * 40 - 50,
        life: 1, s: cell * (0.22 + Math.random() * 0.14)
      });
    }
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (wrap) {
      head.x = (head.x + N) % N;
      head.y = (head.y + N) % N;
    } else if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) {
      return gameOver('wall');
    }
    var eating = heart && head.x === heart.x && head.y === heart.y;
    var limit = eating ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver('self');
    }
    snake.unshift(head);
    if (!eating) { snake.pop(); return; }
    score++;
    burst(head.x, head.y);
    tickMs = Math.max(65, 140 - (level() - 1) * 10);
    if (score > best) { best = score; saveBest(); }
    updateHud();
    if (!placeHeart()) gameOver('full');
  }

  function gameOver(reason) {
    if (score > best) { best = score; saveBest(); }
    updateHud();
    setState('over', reason);
  }

  /* drawing */
  function heartPath(cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.46);
    ctx.bezierCurveTo(cx - s * 0.78, cy - s * 0.02, cx - s * 0.46, cy - s * 0.62, cx, cy - s * 0.2);
    ctx.bezierCurveTo(cx + s * 0.46, cy - s * 0.62, cx + s * 0.78, cy - s * 0.02, cx, cy + s * 0.46);
    ctx.closePath();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(ts) {
    if (!colors) readColors();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = colors.board;
    ctx.fillRect(0, 0, size, size);

    // faint checker
    ctx.fillStyle = colors.grid;
    for (var gx = 0; gx < N; gx++) {
      for (var gy = 0; gy < N; gy++) {
        if ((gx + gy) % 2 === 0) ctx.fillRect(gx * cell, gy * cell, cell, cell);
      }
    }

    // heart
    if (heart) {
      var pulse = reduceMotion ? 1 : 1 + 0.08 * Math.sin(ts / 170);
      ctx.fillStyle = colors.heart;
      heartPath((heart.x + 0.5) * cell, (heart.y + 0.52) * cell, cell * 0.92 * pulse);
      ctx.fill();
    }

    // snake, tail to head
    var inset = cell * 0.07, r = cell * 0.3;
    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.55, 1 - (i / snake.length) * 0.45);
      ctx.fillStyle = i === 0 ? colors.head : colors.snake;
      roundRect(seg.x * cell + inset, seg.y * cell + inset, cell - inset * 2, cell - inset * 2, r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // eyes
    var h = snake[0];
    var hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
    var px = -dir.y, py = dir.x;
    for (var side = -1; side <= 1; side += 2) {
      var ex = hx + dir.x * cell * 0.14 + px * cell * 0.2 * side;
      var ey = hy + dir.y * cell * 0.14 + py * cell * 0.2 * side;
      ctx.fillStyle = colors.board;
      ctx.beginPath(); ctx.arc(ex, ey, cell * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = colors.ink;
      ctx.beginPath(); ctx.arc(ex + dir.x * cell * 0.03, ey + dir.y * cell * 0.03, cell * 0.055, 0, Math.PI * 2); ctx.fill();
    }

    // particles
    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = colors.heart;
      heartPath(p.x, p.y, p.s * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame(ts) {
    var dt = Math.min(ts - (lastTs || ts), 100);
    lastTs = ts;
    if (state === 'playing') {
      acc += dt;
      while (acc >= tickMs && state === 'playing') {
        acc -= tickMs;
        step();
      }
    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt / 1000;
      p.y += p.vy * dt / 1000;
      p.vy += 120 * dt / 1000;
      p.life -= dt / 600;
      if (p.life <= 0) particles.splice(i, 1);
    }
    draw(ts);
    requestAnimationFrame(frame);
  }

  /* input */
  var keyMap = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var m = keyMap[e.key];
    if (m) { e.preventDefault(); setDir(m[0], m[1]); return; }
    if (e.key === ' ' || e.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      e.preventDefault();
      mainAction();
    }
  });

  var touchStart = null;
  canvas.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse') return;
    touchStart = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!touchStart) return;
    var dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  });
  canvas.addEventListener('pointercancel', function () { touchStart = null; });

  document.querySelectorAll('.dpad button').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var d = b.getAttribute('data-dir');
      if (d === 'up') setDir(0, -1);
      else if (d === 'down') setDir(0, 1);
      else if (d === 'left') setDir(-1, 0);
      else setDir(1, 0);
    });
  });

  veilBtn.addEventListener('click', mainAction);
  pauseBtn.addEventListener('click', mainAction);

  function setMode(w) {
    wrap = w;
    modeWall.setAttribute('aria-pressed', String(!w));
    modeWrap.setAttribute('aria-pressed', String(w));
    loadBest();
    reset();
    setState('ready');
  }
  modeWall.addEventListener('click', function () { setMode(false); });
  modeWrap.addEventListener('click', function () { setMode(true); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === 'playing') setState('paused');
  });

  new ResizeObserver(resize).observe(canvas);

  wrap = false;
  loadBest();
  reset();
  resize();
  setState('ready');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
